name: Sincronización Diaria de Newsletters

on:
  schedule:
    # Se ejecuta todos los días a las 08:00, 14:00 y 20:00 UTC
    - cron: '0 8,14,20 * * *'
  workflow_dispatch: # Permite pulsar un botón en GitHub para sincronizar manualmente cuando quieras

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sincronizar Newsletters desde Mail.tm
        env:
          MAILTM_EMAIL: ${{ secrets.MAILTM_EMAIL }}
          MAILTM_PASSWORD: ${{ secrets.MAILTM_PASSWORD }}
        run: |
          python3 fetch_newsletters.py

      - name: Generar versión web estática
        run: |
          python3 build_static.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ index.html dist/ streetwear_swipe_file.zip
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: Nuevas newsletters archivadas [skip ci]" && git push)
